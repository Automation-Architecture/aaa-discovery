name: Auto-Merge when Checks Green

# Squash-merges a PR once all check-runs on the HEAD SHA complete with no failures.
#
# Uses workflow_run (not check_suite) because GitHub does not emit check_suite
# events for GITHUB_TOKEN-run CI workflows. workflow_run is always emitted.
#
# Lists "CI" — the workflow name in ci.yml. The check-runs gate examines ALL
# check-runs on the SHA, not just the triggering one.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA="${{ github.event.workflow_run.head_sha }}"
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR for SHA $SHA — nothing to merge."
            exit 0
          fi
          echo "PR #$PR_NUMBER  HEAD $SHA"

          CHECK_RUNS=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[]' | jq -s '.')

          TOTAL=$(echo "$CHECK_RUNS"   | jq 'length')
          PENDING=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$CHECK_RUNS"  | jq '[.[] | select(
            .conclusion == "failure" or .conclusion == "timed_out" or
            .conclusion == "cancelled" or .conclusion == "action_required"
          )] | length')

          if [ "$TOTAL" -eq 0 ]; then
            echo "No check-runs for $SHA — not merging."
            exit 0
          fi
          if [ "$PENDING" -gt 0 ]; then
            echo "$PENDING check(s) still pending — waiting for next trigger."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED check(s) failed — not merging."
            exit 0
          fi

          # -- Gate: no unresolved review findings on THIS head SHA -----------
          # A review is not a check-run, so the check gate above cannot see Codex
          # findings. Two PRs merged over an unaddressed P1 this way:
          # aaa-SOP#35 (ef42f3b) and invoice-tracker#13 (d742b80), both by
          # github-actions[bot]. Mirrors doc-auto-merge.sh review_verdict().
          #
          # GitHub advances an inline comment's commit_id to the current head for as
          # long as it still applies to the diff; once the flagged hunk changes the
          # comment goes outdated and stops matching. So "commit_id == $SHA" means
          # "findings that still apply to the code we are about to merge".
          #
          # Fails CLOSED -- an unreadable gate is not a passed gate. A blocked PR is
          # not stuck: a human reads the finding and merges, or pushes a fix.
          if ! FINDING_IDS=$(gh api "/repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
               --jq '.[] | select(.commit_id == "'"$SHA"'") | .id' 2>/dev/null); then
            echo "::warning::Could not read review comments for #$PR_NUMBER -- not merging."
            # Revoke any auto-merge armed by an earlier run's `--auto` fallback.
            # Without this the PR still merges the moment the outstanding requirement
            # clears -- exactly what this gate exists to prevent.
            gh pr merge "$PR_NUMBER" --disable-auto --repo "$REPO" >/dev/null 2>&1 || true
            exit 0
          fi
          FINDINGS=$(printf '%s' "$FINDING_IDS" | grep -c . || true)
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::notice::$FINDINGS unresolved review finding(s) on $SHA -- not merging; a human should read them."
            # Revoke any auto-merge armed by an earlier run's `--auto` fallback.
            # Without this the PR still merges the moment the outstanding requirement
            # clears -- exactly what this gate exists to prevent.
            gh pr merge "$PR_NUMBER" --disable-auto --repo "$REPO" >/dev/null 2>&1 || true
            exit 0
          fi
          
          echo "All checks green. Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$SHA" --delete-branch --repo "$REPO" && exit 0
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$SHA" --delete-branch --repo "$REPO" && exit 0
          echo "::warning::Both merge attempts failed for PR #$PR_NUMBER."
          exit 0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell scripts
        run: find . -name '*.sh' -not -path '*/.git/*' -exec bash -n {} + && echo "All .sh files pass syntax check"
